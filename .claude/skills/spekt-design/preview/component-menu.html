<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .menu { width: 280px; background: var(--bg-2); border: 1px solid var(--border-1); border-radius: 14px; padding: 6px; box-shadow: 0 16px 40px -12px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04); }
  .mi { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .mi.hover { background: var(--bg-3); }
  .mi .nm { font-family: var(--font-body); font-size: 13px; color: var(--fg-1); flex: 1; }
  .mi .sh { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-3); }
  .mi svg { width: 16px; height: 16px; color: var(--fg-3); }
  .sep { height: 1px; background: var(--border-1); margin: 6px 4px; }
  .hd { font-family: var(--font-body); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); padding: 8px 10px 4px; }
</style></head>
<body>
<div class="card">
  <span class="label">Menu / popover</span>
  <div class="menu">
    <div class="hd">Create</div>
    <div class="mi hover">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span class="nm">New PRD</span><span class="sh">⌘N</span>
    </div>
    <div class="mi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6v6H9z"/></svg>
      <span class="nm">New BRD</span><span class="sh">⌘B</span>
    </div>
    <div class="mi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span class="nm">Draft from brief</span><span class="sh">⌘⇧N</span>
    </div>
    <div class="sep"></div>
    <div class="mi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/></svg>
      <span class="nm">Save as template</span>
    </div>
  </div>
</div>
</body></html>
