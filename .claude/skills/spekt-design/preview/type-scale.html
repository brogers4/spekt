<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .row-spec { display: grid; grid-template-columns: 1fr 96px; gap: 12px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--border-1); }
  .row-spec:last-child { border-bottom: none; }
  .row-spec .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); text-align: right; }
</style></head>
<body>
<div class="card">
  <span class="label">Type scale</span>
  <div>
    <div class="row-spec"><span style="font-family:var(--font-display);font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-0.02em;color:var(--fg-1)">Display H1</span><span class="meta">40 / 48</span></div>
    <div class="row-spec"><span style="font-family:var(--font-display);font-weight:600;font-size:30px;line-height:1.15;letter-spacing:-0.02em;color:var(--fg-1)">Display H2</span><span class="meta">30 / 38</span></div>
    <div class="row-spec"><span style="font-family:var(--font-display);font-weight:600;font-size:24px;line-height:1.2;color:var(--fg-1)">Section H3</span><span class="meta">24 / 32</span></div>
    <div class="row-spec"><span style="font-family:var(--font-body);font-weight:600;font-size:17px;line-height:1.3;color:var(--fg-1)">UI Title H4</span><span class="meta">17 / 24</span></div>
    <div class="row-spec"><span style="font-family:var(--font-body);font-size:15px;line-height:1.45;color:var(--fg-2)">Body — default copy</span><span class="meta">15 / 22</span></div>
    <div class="row-spec"><span style="font-family:var(--font-body);font-size:13px;color:var(--fg-3)">Small / metadata</span><span class="meta">13 / 18</span></div>
    <div class="row-spec"><span class="label">EYEBROW · OVERLINE</span><span class="meta">12 / 16</span></div>
  </div>
</div>
</body></html>
