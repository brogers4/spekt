<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .btn { font-family: var(--font-body); font-size: 14px; font-weight: 500; border: 1px solid transparent; border-radius: 10px; padding: 9px 16px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; transition: background-color 180ms cubic-bezier(0.32,0.72,0,1); }
  .btn-primary { background: var(--accent-coral); color: var(--fg-on-accent); }
  .btn-primary.hover { background: var(--accent-coral-hover); }
  .btn-primary.press { background: var(--accent-coral-press); transform: scale(0.985); }
  .btn-secondary { background: var(--bg-3); color: var(--fg-1); border-color: var(--border-1); }
  .btn-ghost { background: transparent; color: var(--fg-2); }
  .btn-danger { background: transparent; color: var(--danger); border-color: var(--border-1); }
  .btn-disabled { background: var(--bg-2); color: var(--fg-4); border-color: var(--border-1); cursor: not-allowed; }
  .col-lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); }
  .lane { display: grid; grid-template-columns: 80px 1fr; gap: 16px; align-items: center; padding: 6px 0; }
  svg { width: 14px; height: 14px; }
</style></head>
<body>
<div class="card">
  <span class="label">Buttons</span>
  <div>
    <div class="lane">
      <span class="col-lbl">Primary</span>
      <div class="row" style="gap:10px">
        <button class="btn btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Generate draft</button>
        <button class="btn btn-primary hover">Hover</button>
        <button class="btn btn-primary press">Press</button>
      </div>
    </div>
    <div class="lane">
      <span class="col-lbl">Secondary</span>
      <div class="row" style="gap:10px">
        <button class="btn btn-secondary">Save</button>
        <button class="btn btn-ghost">Cancel</button>
        <button class="btn btn-danger">Discard draft</button>
      </div>
    </div>
    <div class="lane">
      <span class="col-lbl">State</span>
      <div class="row" style="gap:10px">
        <button class="btn btn-disabled">Disabled</button>
        <button class="btn btn-primary" style="box-shadow: 0 0 0 3px var(--accent-coral-ring)">Focused</button>
      </div>
    </div>
  </div>
</div>
</body></html>
