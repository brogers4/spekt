<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .scale { display: flex; flex-direction: column; gap: 8px; }
  .row-sp { display: grid; grid-template-columns: 56px 1fr 64px; align-items: center; gap: 12px; }
  .bar { height: 10px; background: var(--accent-coral); border-radius: 999px; opacity: 0.85; }
  .nm  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
  .px  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); text-align: right; }
</style></head>
<body>
<div class="card">
  <span class="label">Spacing scale · 4px base</span>
  <div class="scale">
    <div class="row-sp"><span class="nm">--space-1</span><div class="bar" style="width:4px"></div><span class="px">4 px</span></div>
    <div class="row-sp"><span class="nm">--space-2</span><div class="bar" style="width:8px"></div><span class="px">8 px</span></div>
    <div class="row-sp"><span class="nm">--space-3</span><div class="bar" style="width:12px"></div><span class="px">12 px</span></div>
    <div class="row-sp"><span class="nm">--space-4</span><div class="bar" style="width:16px"></div><span class="px">16 px</span></div>
    <div class="row-sp"><span class="nm">--space-5</span><div class="bar" style="width:20px"></div><span class="px">20 px</span></div>
    <div class="row-sp"><span class="nm">--space-6</span><div class="bar" style="width:24px"></div><span class="px">24 px</span></div>
    <div class="row-sp"><span class="nm">--space-7</span><div class="bar" style="width:32px"></div><span class="px">32 px</span></div>
    <div class="row-sp"><span class="nm">--space-8</span><div class="bar" style="width:40px"></div><span class="px">40 px</span></div>
    <div class="row-sp"><span class="nm">--space-9</span><div class="bar" style="width:48px"></div><span class="px">48 px</span></div>
    <div class="row-sp"><span class="nm">--space-10</span><div class="bar" style="width:64px"></div><span class="px">64 px</span></div>
  </div>
</div>
</body></html>
