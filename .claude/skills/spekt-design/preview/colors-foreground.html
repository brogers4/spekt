<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .row-fg { display: flex; align-items: center; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--border-1); }
  .row-fg:last-child { border-bottom: none; }
  .dot { width: 28px; height: 28px; border-radius: 999px; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04); }
  .row-fg .nm { flex: 1; font-family: var(--font-body); font-size: 14px; }
  .row-fg .hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
</style></head>
<body>
<div class="card">
  <span class="label">Foreground / text</span>
  <div>
    <div class="row-fg"><div class="dot" style="background:#ECEEF2"></div><div class="nm" style="color:#ECEEF2">fg-1 — primary</div><div class="hex">#ECEEF2</div></div>
    <div class="row-fg"><div class="dot" style="background:#B3B8C3"></div><div class="nm" style="color:#B3B8C3">fg-2 — secondary</div><div class="hex">#B3B8C3</div></div>
    <div class="row-fg"><div class="dot" style="background:#7C8290"></div><div class="nm" style="color:#7C8290">fg-3 — tertiary</div><div class="hex">#7C8290</div></div>
    <div class="row-fg"><div class="dot" style="background:#555B68"></div><div class="nm" style="color:#555B68">fg-4 — disabled</div><div class="hex">#555B68</div></div>
  </div>
</div>
</body></html>
