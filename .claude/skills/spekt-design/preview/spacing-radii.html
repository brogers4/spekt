<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .shape { width: 100%; aspect-ratio: 1; background: var(--bg-3); border: 1px solid var(--border-2); }
  .nm { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style></head>
<body>
<div class="card">
  <span class="label">Corner radii</span>
  <div class="grid">
    <div class="item"><div class="shape" style="border-radius:4px"></div><div class="nm">xs</div><div class="px">4 px</div></div>
    <div class="item"><div class="shape" style="border-radius:6px"></div><div class="nm">sm</div><div class="px">6 px</div></div>
    <div class="item"><div class="shape" style="border-radius:10px"></div><div class="nm">md</div><div class="px">10 px</div></div>
    <div class="item"><div class="shape" style="border-radius:14px"></div><div class="nm">lg</div><div class="px">14 px</div></div>
    <div class="item"><div class="shape" style="border-radius:20px"></div><div class="nm">xl</div><div class="px">20 px</div></div>
    <div class="item"><div class="shape" style="border-radius:999px"></div><div class="nm">full</div><div class="px">999 px</div></div>
  </div>
</div>
</body></html>
