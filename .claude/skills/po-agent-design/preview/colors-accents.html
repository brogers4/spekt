<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .pair { display: flex; gap: 16px; }
  .big { flex: 1; height: 120px; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--border-1); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04); }
  .stack { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .mini { height: 36px; border-radius: 8px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; }
  .lab { font-family: var(--font-body); font-size: 13px; font-weight: 500; }
  .hx { font-family: var(--font-mono); font-size: 10.5px; opacity: 0.7; }
</style></head>
<body>
<div class="card">
  <span class="label">Accents · coral &amp; sage</span>
  <div class="pair">
    <div class="big" style="background:#E8927C">
      <div style="color:#1A0F0B"><div class="lab">accent · coral</div><div class="hx">primary action · AI voice</div></div>
      <div class="stack" style="grid-template-columns: 1fr 1fr 1fr; gap:6px">
        <div class="mini" style="background:#DA8067;color:#1A0F0B"><span class="lab" style="font-size:11px">hover</span><span class="hx">#DA8067</span></div>
        <div class="mini" style="background:#C46F58;color:#1A0F0B"><span class="lab" style="font-size:11px">press</span><span class="hx">#C46F58</span></div>
        <div class="mini" style="background:#2A1C18;color:#E8927C;border:1px solid #3A2820"><span class="lab" style="font-size:11px">soft</span><span class="hx">#2A1C18</span></div>
      </div>
    </div>
    <div class="big" style="background:#8FB9A8">
      <div style="color:#0F1A16"><div class="lab">accent · sage</div><div class="hx">confirmed · saved</div></div>
      <div class="stack" style="grid-template-columns: 1fr 1fr; gap:6px">
        <div class="mini" style="background:#7CA897;color:#0F1A16"><span class="lab" style="font-size:11px">hover</span><span class="hx">#7CA897</span></div>
        <div class="mini" style="background:#1A2522;color:#8FB9A8;border:1px solid #243532"><span class="lab" style="font-size:11px">soft</span><span class="hx">#1A2522</span></div>
      </div>
    </div>
  </div>
</div>
</body></html>
