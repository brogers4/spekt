<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .toast { display: flex; align-items: center; gap: 12px; background: var(--bg-2); border: 1px solid var(--border-1); border-radius: 12px; padding: 12px 14px; box-shadow: 0 16px 40px -12px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04); }
  .toast .ic { width: 26px; height: 26px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .toast .ic svg { width: 14px; height: 14px; }
  .toast .nm { font-family: var(--font-body); font-size: 13.5px; color: var(--fg-1); flex: 1; }
  .toast .ac { font-family: var(--font-body); font-size: 13px; color: var(--accent-coral); cursor: pointer; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
</style></head>
<body>
<div class="card">
  <span class="label">Toasts &amp; alerts</span>
  <div class="stack">
    <div class="toast">
      <div class="ic" style="background:#1A2522;color:#8FB9A8"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="nm">Saved to your workspace.</div>
      <div class="ac">Open</div>
    </div>
    <div class="toast">
      <div class="ic" style="background:#2A2317;color:#E8C679"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>
      <div class="nm">Draft is older than 7 days — refresh from your brief?</div>
      <div class="ac">Refresh</div>
    </div>
    <div class="toast">
      <div class="ic" style="background:#2A1818;color:#E08585"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
      <div class="nm">We couldn't reach Jira. Check your connection in Settings.</div>
      <div class="ac">Retry</div>
    </div>
  </div>
</div>
</body></html>
