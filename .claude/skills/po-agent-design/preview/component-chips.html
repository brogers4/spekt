<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip { font-family: var(--font-body); font-size: 12px; padding: 4px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-1); color: var(--fg-2); background: var(--bg-2); }
  .chip .dot { width: 6px; height: 6px; border-radius: 999px; }
  .tag { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.04em; padding: 2px 7px; border-radius: 6px; text-transform: uppercase; font-weight: 600; }
  .kbd { font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; border-radius: 4px; background: var(--bg-3); border: 1px solid var(--border-2); border-bottom-width: 2px; color: var(--fg-2); }
  .lane { display: grid; grid-template-columns: 90px 1fr; gap: 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border-1); }
  .lane:last-child { border-bottom: none; }
  .col-lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); }
</style></head>
<body>
<div class="card">
  <span class="label">Chips, tags &amp; keys</span>
  <div>
    <div class="lane">
      <span class="col-lbl">Status</span>
      <div class="group">
        <span class="chip"><span class="dot" style="background:#E8C679"></span>Draft</span>
        <span class="chip"><span class="dot" style="background:#7CCFA6"></span>Approved</span>
        <span class="chip"><span class="dot" style="background:#8BB3E8"></span>In review</span>
        <span class="chip"><span class="dot" style="background:#E08585"></span>Blocked</span>
        <span class="chip" style="background:var(--accent-coral-soft);color:var(--accent-coral);border-color:#3A2820"><span class="dot" style="background:#E8927C"></span>Drafting…</span>
      </div>
    </div>
    <div class="lane">
      <span class="col-lbl">Type tag</span>
      <div class="group">
        <span class="tag" style="background:#2A1C18;color:#E8927C">PRD</span>
        <span class="tag" style="background:#1A2522;color:#8FB9A8">BRD</span>
        <span class="tag" style="background:#182230;color:#8BB3E8">RFC</span>
        <span class="tag" style="background:#2A2317;color:#E8C679">EPIC</span>
        <span class="tag" style="background:var(--bg-3);color:var(--fg-2)">STORY</span>
      </div>
    </div>
    <div class="lane">
      <span class="col-lbl">Keys</span>
      <div class="group">
        <span class="kbd">⌘</span><span class="kbd">K</span>
        <span style="color:var(--fg-3);font-size:12px">to search</span>
        <span style="width:16px"></span>
        <span class="kbd">⌘</span><span class="kbd">↵</span>
        <span style="color:var(--fg-3);font-size:12px">to generate</span>
      </div>
    </div>
  </div>
</div>
</body></html>
