<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PO Agent — Web App</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="icon" href="../../assets/logo-mark.svg" />
  <style>
    html, body { margin: 0; padding: 0; min-height: 100vh; background: var(--bg-canvas); color: var(--fg-1); }
    #root { display: flex; min-height: 100vh; }
    main { flex: 1; min-width: 0; }
    /* The breathing pulse for the agent's thinking state */
    @keyframes po-breathe {
      0%, 100% { box-shadow: 0 0 0 0 rgba(232,146,124,0.5); opacity: 0.9; }
      50%      { box-shadow: 0 0 0 8px rgba(232,146,124,0); opacity: 1; }
    }
    /* hide scrollbars on the inspector to keep things calm */
    aside::-webkit-scrollbar { width: 8px; }
    aside::-webkit-scrollbar-thumb { background: var(--border-1); border-radius: 999px; }
    aside::-webkit-scrollbar-track { background: transparent; }
    /* page transition */
    .pg-enter { animation: pg-in 260ms cubic-bezier(0.32, 0.72, 0, 1); }
    @keyframes pg-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body data-screen-label="PO Agent · Web App">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="Sidebar.jsx"></script>
  <script type="text/babel" src="TopBar.jsx"></script>
  <script type="text/babel" src="Dashboard.jsx"></script>
  <script type="text/babel" src="Composer.jsx"></script>
  <script type="text/babel" src="ArtifactView.jsx"></script>

  <script type="text/babel">
    const App = () => {
      const [route, setRoute] = React.useState('dashboard'); // 'dashboard' | 'composer' | 'artifact'
      const [opened, setOpened] = React.useState(null);

      const openArtifact = (a) => { setOpened(a); setRoute('artifact'); };
      const goCompose = () => setRoute('composer');
      const goHome = () => setRoute('dashboard');

      const titleFor = () => {
        if (route === 'dashboard') return 'Library';
        if (route === 'composer') return 'New artifact';
        return opened ? opened.title : 'Artifact';
      };
      const crumbsFor = () => {
        if (route === 'dashboard') return [];
        if (route === 'composer') return ['Library'];
        return ['Library', opened ? opened.kind : ''];
      };

      const topRight = route === 'artifact' ? null : (
        <div style={{ display: 'flex', gap: 8 }}>
          <IconButton name="inbox" label="Inbox" />
          <IconButton name="settings" label="Settings" />
        </div>
      );

      return (
        <>
          <Sidebar route={route} onNavigate={(r) => { setRoute(r); }} />
          <main>
            <TopBar
              title={titleFor()}
              crumbs={crumbsFor()}
              right={topRight}
              onBack={route !== 'dashboard' ? goHome : null}
            />
            <div key={route + (opened?.id ?? '')} className="pg-enter">
              {route === 'dashboard' && <Dashboard onOpen={openArtifact} onCompose={goCompose} />}
              {route === 'composer' && <Composer onBack={goHome} onPublish={() => openArtifact(ARTIFACTS[0])} />}
              {route === 'artifact' && <ArtifactView artifact={opened} onBack={goHome} />}
            </div>
          </main>
        </>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
